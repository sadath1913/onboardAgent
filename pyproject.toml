[project]
name = "onboard-agent"
version = "0.2.0"
description = "RAG-based Developer Onboarding and Codebase Intelligence Agent"
requires-python = ">=3.11"

dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "transformers>=4.40",
    "torch>=2.2",
    "sentence-transformers>=2.7",
    "groq>=0.8",
    "fpdf2>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
onboard-agent = "backend.main:main"

[tool.unittest]
start-directory = "tests"

[tool.setuptools.packages.find]
include = ["backend*"]